# CI for versa-scan: fmt -> clippy -> tests on both target OSes, then
# broker-backed integration tests on Linux. Brokers run as plain containers
# started in Linux-only steps: service containers are Linux-only (a services
# block would kill the Windows leg) and cannot pass server args (NATS
# JetStream needs `-js`).

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Broker integration tests (crates/versa-scan-infra/tests/brokers.rs)
      # run only where these brokers are up - Linux. Windows skips them.
      - name: Start brokers (RabbitMQ + NATS)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name rabbitmq \
            -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=versa -e RABBITMQ_DEFAULT_PASS=versa \
            rabbitmq:3.13
          for i in $(seq 1 60); do
            if docker exec rabbitmq rabbitmq-diagnostics -q ping > /dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs rabbitmq
              exit 1
            fi
            sleep 1
          done

          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2.11 -js -m 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs nats
          exit 1

      - name: Install pinned toolchain
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy

      - name: Rustfmt (verify formatting)
        run: cargo +1.98 fmt --all -- --check

      - name: Clippy (deny-level lints gate)
        run: cargo +1.98 clippy --all-targets --locked

      # Broker integration tests: the env opts the tests in and is only set
      # on the Linux leg (where the brokers above are running).
      - name: Tests (broker integration, Linux)
        if: runner.os == 'Linux'
        env:
          VS_SCAN_TEST_RABBITMQ: amqp://versa:versa@localhost:5672/%2f
          VS_SCAN_TEST_NATS: nats://localhost:4222
        run: cargo +1.98 test --locked

      - name: Tests
        if: runner.os != 'Linux'
        run: cargo +1.98 test --locked

      - name: Build release binaries
        run: cargo +1.98 build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: versa-scan-${{ matrix.os }}
          path: |
            target/release/vsd${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/vscli${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7
