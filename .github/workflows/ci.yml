# CI for versa-scan: fmt -> clippy -> tests on both target OSes, then
# broker-backed integration tests on Linux (added from M2 onward via
# docker-compose services).

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    services:
      # Broker integration tests (crates/versa-scan-infra/tests/brokers.rs)
      # run only where these env vars are set - Linux. Windows skips them.
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      nats:
        image: nats:2.11
        args: ["-js"]
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy

      - name: Rustfmt (verify formatting)
        run: cargo +1.98 fmt --all -- --check

      - name: Clippy (deny-level lints gate)
        run: cargo +1.98 clippy --all-targets

      - name: Tests
        env:
          VERSA_SCAN_TEST_RABBITMQ: amqp://versa:versa@localhost:5672/%2f
          VERSA_SCAN_TEST_NATS: nats://localhost:4222
        run: cargo +1.98 test

      - name: Build release binaries
        run: cargo +1.98 build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: versa-scan-${{ matrix.os }}
          path: |
            target/release/vsd${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/vscli${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 7
