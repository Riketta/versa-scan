[workspace]
resolver = "3"
members = [
    "crates/versa-scan-core",
    "crates/versa-scan-infra",
    "bins/vsd",
    "bins/vscli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
versa-scan-core = { path = "crates/versa-scan-core" }
versa-scan-infra = { path = "crates/versa-scan-infra" }

async-nats = "0.42"
async-trait = "0.1.91"
bon = "3.9.1"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15.25", default-features = false, features = [
    "convert-case",
    "toml",
] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
lapin = "3.0"
parking_lot = "0.12.5"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "gzip",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.19"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
    "fs",
    "process",
] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
indexing_slicing = "deny"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
string_slice = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
